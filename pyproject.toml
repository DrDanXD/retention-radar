[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "retention-radar"
version = "0.1.0"
description = "Early warning for member churn at longevity clinics. Scores drift from wearable, messaging, habit, lab and coach signals."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Dhiyanesh" }]
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
llm = ["anthropic>=0.40"]
viz = ["matplotlib>=3.8"]
dev = [
  "pytest>=8",
  "ruff>=0.5",
  "httpx>=0.27",
  "fastapi>=0.110",
  "matplotlib>=3.8",
]

[project.scripts]
radar = "retention_radar.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/retention_radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
